[project]
name = "edumechanic-3d-api"
version = "0.1.0"
description = "EduMechanic 3D - FastAPI & CadQuery Parametric Backend Engine"
authors = [{ name = "Anti-Gravity Dev Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "cadquery>=2.4.0; sys_platform != 'win32'",
    "trimesh>=4.2.0",
    "mapbox_earcut>=1.0.0",
    "rtree>=1.0.0",
    "shapely>=2.0.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
