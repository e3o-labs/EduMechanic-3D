version: '3.8'

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:1234
    depends_on:
      - api
      - yjs-ws

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_URL=postgresql://edumechanic:secret123@db:5432/edumechanic_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  yjs-ws:
    build:
      context: .
      dockerfile: harness/mocks/Dockerfile
    ports:
      - "1234:1234"

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: edumechanic
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: edumechanic_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
